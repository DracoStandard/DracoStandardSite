# Save as .github/workflows/deploy.yml in your repo
name: Build and deploy to Azure Container Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-***REMOVED***: write      # for Azure OIDC login
  contents: read
  packages: write      # to push to GitHub Container Registry

env:
  PROJECT_PATH: DracoStandardSite/DracoStandardSite.csproj   # <-- check this path
  IMAGE_NAME: draco-web-site
  CONTAINER_APP: draco-web-site                             # <-- your container app name
  RESOURCE_GROUP: DracoStandard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # match your TargetFramework (8.0.x if still on net8.0)

      - name: Set lowercase image path
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --***REMOVED***-stdin

      - name: Build and push container image
        run: >
          dotnet publish ${{ env.PROJECT_PATH }} -c Release
          /t:PublishContainer
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=${{ env.IMAGE_REPO }}
          -p:ContainerImageTag=${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: >
          az containerapp update
          --name ${{ env.CONTAINER_APP }}
          --resource-group ${{ env.RESOURCE_GROUP }}
          --image ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
